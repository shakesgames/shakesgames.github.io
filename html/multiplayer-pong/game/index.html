<head>
    <title>Your Website Title</title>
    <script>



        window.addEventListener('load', function() {
            // Create intro container
            var introDiv = document.createElement('div');
            introDiv.id = 'intro';

            // Create and add SHAKESGAMES text
            var brandDiv = document.createElement('div');
            brandDiv.id = 'shakesgames';
            brandDiv.innerText = "Shake's Games";
            brandDiv.style.opacity = '0'; // Start invisible
            introDiv.appendChild(brandDiv);

            // Append intro to body
            document.body.insertBefore(introDiv, document.body.firstChild);

            // Add styles
            var css = `
                #intro {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: #1e4d2b;
                    z-index: 1000;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    transition: transform 0.5s ease-in-out;
                }

                #shakesgames {
                    font-size: 3em;
                    font-weight: bold;
                    opacity: 0;
                    animation: fadeInSlam 1s ease forwards;
                }

                #shakesgames {
                    color: #fdf6e3;
                }

                @keyframes fadeInSlam {
                    0% { transform: scale(0); opacity: 0; }
                    50% { transform: scale(1.2); opacity: 1; }
                    100% { transform: scale(1); opacity: 1; }
                }

                @keyframes riseUp {
                    0% { transform: translateY(0); }
                    100% { transform: translateY(-100px); }
                }
                    50% { transform: scale(1.1); opacity: 1; }
                    75% { transform: scale(0.9); }
                    100% { transform: scale(1); }
                }
            `;
            var styleSheet = document.createElement('style');
            styleSheet.type = 'text/css';
            styleSheet.innerText = css;
            document.head.appendChild(styleSheet);

            // Trigger image fade-in and text fade-out
            setTimeout(() => {
                brandDiv.style.opacity = 0;
            }, 1500);

            // Slide up and remove intro
            setTimeout(() => {
                introDiv.style.transform = 'translateY(-100%)';
                setTimeout(() => { introDiv.remove(); }, 500);
            }, 3200);
        });
    </script>
</head>


<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Canvas Pong!</title>

	<style>
		body {
			background: #00caa0;
			position: relative;
			padding: 0;
			margin: 0;
			font-family: sans-serif;
		}

		#pongCanvas,
		#paddleCanvas {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}

		#pongCanvas {
			background: white;
		}

		.score {
			position: absolute;
			top: 50vh;
			transform: translateY(-50%);
			font-size: 90px;
			font-weight: bold;
		}

		#leftScore {
			left: 20px;
		}

		#rightScore {
			right: 20px;
		}

		.controls {
			position: absolute;
			top: 70vh;
			transform: translateY(50%);
		}

		.left-controls {
			left: 30px;
		}

		.right-controls {
			right: 30px;
		}

		.directions {
			position: fixed;
			bottom: 10px;
			text-align: center;
			left: 50%;
			transform: translateX(-50%);
			font-size: 20px;
		}

		#modal {
			display: none;
			position: absolute;
			width: 100vw;
			height: 100vh;
			top: 0;
			left: 0;
			background: rgba(255,255,255, 0.8);
		}

		#modal .message {
			position: relative;
			overflow: auto;
			text-align: center;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
		}

		#modal .main-info {
			text-transform: uppercase;
			font-weight: bold;
			font-size: 60px;
			line-height: 1.5;
		}

		#modal .sub-info {
			font-size: 20px;
		}
	</style>

	<script src="initialization.js?v=0.1"></script>
</head>
<body>
	<canvas id="pongCanvas" width="1000" height="600" border="1px solid #333"></canvas>
	<canvas id="paddleCanvas" width="1000" height="600" border="1px solid #333"></canvas>

	<div id="leftScore" class="score">0</div>
	<div class="controls left-controls">
		<p><strong>Up:</strong> "A"</p>
		<p><strong>Down:</strong> "Z"</p>
	</div>
	<div id="rightScore" class="score">0</div>
	<div class="controls right-controls">
		<p><strong>Up:</strong> &uarr;</p>
		<p><strong>Down:</strong> &darr;</p>
	</div>

	<div class="directions">Press space to start and to pause.</div>
	<div id="modal">
		<div class="message">
			<div class="main-info">
				Paused
			</div>
			<div class="sub-info">
				Press space bar to resume.
			</div>
		</div>
	</div>
</body>
</html>
