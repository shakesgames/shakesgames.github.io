<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>A Dance of Fire And Ice | DachXD</title>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/adofaiii4.json");
    </script>
    <style>
      html,body{margin:0;height:100%;overflow:hidden;background:#231F20}
      #gameContainer{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      // Scale the fixed-size (800x400) Unity canvas up to fill the frame
      // while preserving aspect ratio, without stretching it.
      var NATW = 800, NATH = 400;
      function fitGame() {
        var c = document.getElementById('gameContainer');
        if (!c) return;
        var cv = c.querySelector('canvas');
        if (!cv) { setTimeout(fitGame, 500); return; }
        var cw = c.clientWidth, ch = c.clientHeight;
        if (!cw || !ch) return;
        var s = Math.min(cw / NATW, ch / NATH);
        cv.style.width = Math.floor(NATW * s) + 'px';
        cv.style.height = Math.floor(NATH * s) + 'px';
      }
      if (document.readyState === 'complete') fitGame();
      else window.addEventListener('load', fitGame);
      window.addEventListener('resize', fitGame);
      setInterval(fitGame, 1500);
    </script>
  </body>
</html>
