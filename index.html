		<script>
			async function getAllIndexedDBData() {
				if (!indexedDB.databases) return {};
				let dbList = [];
				try {
					dbList = await indexedDB.databases();
				} catch (e) {
					return {};
				}
				const result = {};
				for (const dbInfo of dbList) {
					if (!dbInfo.name) continue;
					result[dbInfo.name] = await getDataFromDatabase(dbInfo.name);
				}
				return result;
			}
			function getDataFromDatabase(dbName) {
				return new Promise((resolve, reject) => {
					const request = indexedDB.open(dbName);
					(request.onsuccess = e => {
						const db = e.target.result,
							storeNames = Array.from(db.objectStoreNames),
							dbData = {},
							pendingCount = storeNames.length;
						if (!pendingCount) {
							db.close(), resolve(dbData);
							return;
						}
						let pending = pendingCount;
						storeNames.forEach(storeName => {
							const transaction = db.transaction(storeName, "readonly"),
								store = transaction.objectStore(storeName),
								items = [],
								cursorRequest = store.openCursor();
							(cursorRequest.onsuccess = evt => {
								const cursor = evt.target.result;
								if (cursor)
									items.push({ key: cursor.key, value: cursor.value }),
										cursor.continue();
								else {
									(dbData[storeName] = items),
										pending--,
										!pending && (db.close(), resolve(dbData));
								}
							}),
								(cursorRequest.onerror = () => {
									pending--, !pending && (db.close(), resolve(dbData));
								});
						});
					}),
						(request.onerror = e => {
							reject(e.target.error);
						});
				});
			}
			async function setAllIndexedDBData(indexedData) {
				for (const dbName in indexedData) {
					const storesData = indexedData[dbName];
					await new Promise(resolve => {
						const deleteRequest = indexedDB.deleteDatabase(dbName);
						(deleteRequest.onsuccess = () => resolve()),
							(deleteRequest.onerror = () => resolve()),
							(deleteRequest.onblocked = () => resolve());
					});
					const openRequest = indexedDB.open(dbName, 1);
					openRequest.onupgradeneeded = function (e) {
						const db = e.target.result;
						for (const storeName in storesData)
							db.objectStoreNames.contains(storeName) ||
								db.createObjectStore(storeName, { autoIncrement: false });
					};
					const dbInstance = await new Promise((resolve, reject) => {
						(openRequest.onsuccess = e => {
							resolve(e.target.result);
						}),
							(openRequest.onerror = e => {
								reject(e.target.error);
							});
					});
					for (const storeName in storesData)
						await new Promise(resolve => {
							const transaction = dbInstance.transaction(storeName, "readwrite");
							(transaction.oncomplete = () => resolve()),
								(transaction.onerror = () => resolve());
							const store = transaction.objectStore(storeName),
								clearRequest = store.clear();
							clearRequest.onsuccess = async () => {
								for (const record of storesData[storeName])
									await new Promise(r => {
										const putRequest = store.put(record.value, record.key);
										(putRequest.onsuccess = () => r()),
											(putRequest.onerror = () => r());
									});
							};
						});
					dbInstance.close();
				}
			}
		</script>

			function normalizeGameName(name) {
				return name
					.toLowerCase()
					.replace(/\s+/g, "")
					.replace(/[^a-z0-9]/g, "");
			}
			function toTitleCase(name) {
				return name.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1));
			}
			function findMatchingCard(gameName) {
				const normalized = normalizeGameName(gameName),
					allCards = document.querySelectorAll("#allList .card");
				for (let card of allCards)
					if (card.getAttribute("data-game-id") === normalized) return card;
				return null;
			}
			function getPageNumberFromURL(url) {
				const regex = /(shakesgames)(-?\d*)/g;
				let match,
					last = null;
				while ((match = regex.exec(url)) !== null) last = match;
				if (last) {
					const num = last[2].replace("-", "");
					return num === "" ? 1 : parseInt(num, 10);
				}
				return 1;
			}
			function getCurrentSiteKey() {
				const currentURL = window.location.href,
					keys = Object.keys(siteMapping).sort((a, b) => b.length - a.length);
				for (const k of keys) if (currentURL.includes(k)) return k;
				return null;
			}
			function getAdjustedUrls(href, imgSrc, page) {
				let adjustedHref = href,
					adjustedImgSrc = `./img/${imgSrc}`,
					currentSiteKey = getCurrentSiteKey();
				if (currentSiteKey) {
					const currentSitePages = siteMapping[currentSiteKey],
						pageMap = {},
						currentPageNumber = getPageNumberFromURL(currentSiteKey);
					pageMap[currentPageNumber] = currentSiteKey;
					if (currentSitePages) {
						currentSitePages.forEach(u => {
							const pNum = getPageNumberFromURL(u);
							pageMap[pNum] = u;
						});
					}
					if (page !== undefined && page !== currentPageNumber) {
						let newBase = pageMap[page];
						newBase || (newBase = window.location.origin + `/shakesgames${page}`),
							(adjustedHref = `${newBase}/${href.replace(/^\.\//, "")}`),
							(adjustedImgSrc = `${newBase}/img/${imgSrc.replace(/^\.\//, "")}`);
					}
				} else if (page !== undefined && page > 1) {
					const origin = window.location.origin,
						newBase = `${origin}/shakesgames${page}`;
					(adjustedHref = `${newBase}/${href.replace(/^\.\//, "")}`),
						(adjustedImgSrc = `${newBase}/img/${imgSrc.replace(/^\.\//, "")}`);
				}
				return { adjustedHref, adjustedImgSrc };
			}
			function getCardHTML(game) {
				const { href, imgSrc, name, page, id } = game,
					{ adjustedHref, adjustedImgSrc } = getAdjustedUrls(href, imgSrc, page),
					gameLink = `./play/?id=${id}`,
					normalized = normalizeGameName(name),
					displayName = toTitleCase(name);
				return `
          <a href="${gameLink}" class="card" data-game-id="${normalized}" data-page="${page}">
            <img src="${adjustedImgSrc}" alt="${displayName}" loading="lazy">
            <figcaption>${displayName}</figcaption>
          </a>
        `;
			}
			function firstAlnumChar(name) {
				const m = name.toLowerCase().match(/[a-z0-9]/);
				return m ? m[0] : "";
			}
			const sortedGames = [...games].sort((a, b) => {
				const aNum = /[0-9]/.test(firstAlnumChar(a.name)) ? 1 : 0,
					bNum = /[0-9]/.test(firstAlnumChar(b.name)) ? 1 : 0;
				if (aNum !== bNum) return aNum - bNum;
				return a.name.localeCompare(b.name, undefined, {
					numeric: true,
					sensitivity: "base",
				});
			});
			const allListElement = document.getElementById("allList"),
				alphabetFilter = document.getElementById("alphabetFilter");
			allListElement.innerHTML = sortedGames.map(g => getCardHTML(g)).join("");

			let activeFilter = null;
			function cardMatchesFilter(card) {
				if (activeFilter === null) return true;
				const first = (card.getAttribute("data-game-id") || "")[0] || "";
				return activeFilter === "#" ? /[0-9]/.test(first) : first === activeFilter;
			}
			function renderGames() {
				allListElement.querySelectorAll(".card").forEach(card => {
					card.style.display = cardMatchesFilter(card) ? "" : "none";
				});
				if (alphabetFilter) {
					alphabetFilter.querySelectorAll(".alpha-btn").forEach(btn => {
						btn.classList.toggle("active", btn.dataset.filter === activeFilter);
					});
				}
			}
			if (alphabetFilter) {
				"abcdefghijklmnopqrstuvwxyz".split("").forEach(l => {
					const btn = document.createElement("button");
					btn.className = "alpha-btn";
					btn.type = "button";
					btn.dataset.filter = l;
					btn.textContent = l.toUpperCase();
					btn.title = `Show games starting with ${l.toUpperCase()}`;
					alphabetFilter.appendChild(btn);
				});
				const hashBtn = document.createElement("button");
				hashBtn.className = "alpha-btn";
				hashBtn.type = "button";
				hashBtn.dataset.filter = "#";
				hashBtn.textContent = "#";
				hashBtn.title = "Show games starting with a number";
				alphabetFilter.appendChild(hashBtn);
				alphabetFilter.addEventListener("click", ev => {
					const btn = ev.target.closest(".alpha-btn");
					if (!btn) return;
					activeFilter = activeFilter === btn.dataset.filter ? null : btn.dataset.filter;
					renderGames();
				});
			}

			const searchInput = document.getElementById("searchInput");
			searchInput.placeholder = "Find your next game";

			const searchResults = document.getElementById("searchResults");

			function updateSearchResults() {
				const text = searchInput.value.toLowerCase(),
					filtered = sortedGames.filter(g => g.name.toLowerCase().includes(text)).slice(0, 7);
				searchResults.innerHTML = "";
				if (!filtered.length) {
					searchResults.style.display = "none";
					return;
				}
				filtered.forEach(game => {
					const { id, imgSrc, name, page } = game,
						{ adjustedImgSrc } = getAdjustedUrls(game.href, imgSrc, page),
						linkEl = document.createElement("a"),
						displayName = toTitleCase(name);
					(linkEl.href = `./play/?id=${id}`),
						(linkEl.innerHTML = `<img src="${adjustedImgSrc}" alt="${displayName}"><span>${displayName}</span>`),
						searchResults.appendChild(linkEl);
				}),
					(searchResults.style.display = "block");
			}
			if (searchInput && searchResults) {
				searchInput.addEventListener("focus", updateSearchResults),
					searchInput.addEventListener("input", updateSearchResults),
					document.addEventListener("click", ev => {
						if (!searchInput.contains(ev.target) && !searchResults.contains(ev.target))
							searchResults.style.display = "none";
					});
			}
			document.getElementById("randomGameBtn")?.addEventListener("click", () => {
				if (games.length > 0) {
					const idx = Math.floor(Math.random() * games.length);
					window.location.href = `./play/?id=${games[idx].id}`;
				}
			});
			document.getElementById("aboutBlankBtn")?.addEventListener("click", () => {
				const url = window.location.href,
					newTab = window.open();
				if (!newTab) return;
				newTab.document.write(`
            <html>
              <body style="margin:0;height:100vh;">
                <iframe src="${url}" style="border:none;width:100%;height:100%"></iframe>
              </body>
            </html>
          `),
					newTab.document.close();
			});
			const settingsOverlay = document.getElementById("settingsOverlay"),
				settingsBtn = document.getElementById("settingsBtn"),
				settingsClose = document.getElementById("settingsClose");
			settingsBtn?.addEventListener("click", () => {
				settingsOverlay.style.display = "flex";
			});
			settingsClose?.addEventListener("click", () => {
				settingsOverlay.style.display = "none";
			});
			settingsOverlay?.addEventListener("click", ev => {
				if (ev.target === settingsOverlay) settingsOverlay.style.display = "none";
			});
			const panicToggle = document.getElementById("panicToggle");
			if (panicToggle) {
				panicToggle.checked = localStorage.getItem("sg_panic") !== "off";
				panicToggle.addEventListener("change", () => {
					localStorage.setItem("sg_panic", panicToggle.checked ? "on" : "off");
					panicBtn.style.display = panicToggle.checked ? "flex" : "none";
				});
			}
			function setCookie(name, val, days) {
				const d = new Date();
				d.setTime(d.getTime() + 24 * 60 * 60 * 1e3 * days),
					(document.cookie = `${name}=${val};expires=${d.toUTCString()};path=/`);
			}
			function getCookie(name) {
				const all = `; ${document.cookie}`,
					parts = all.split(`; ${name}=`);
				if (parts.length === 2) return parts.pop().split(";")[0];
				return "";
			}

			const cardSizeSlider = document.getElementById("cardSizeSlider"),
				cardSizeValue = document.getElementById("cardSizeValue");
			function updateCardSizes() {
				const val = parseInt(cardSizeSlider.value, 10);
				cardSizeValue.textContent = val;
				const newSize = 120 + val,
					newGap = Math.max(10 + val / 4, 5),
					newRadius = 0;
				document.querySelectorAll(".card, .ghost-card").forEach(c => {
					(c.style.width = newSize + "px"),
						(c.style.height = newSize + "px"),
						(c.style.borderRadius = newRadius + "px");
				}),
					document.querySelectorAll(".games-grid").forEach(grid => {
						grid.style.gap = newGap + "px";
					}),
					setCookie("cardSize", val, 365);
			}
			cardSizeSlider.addEventListener("input", updateCardSizes);
			const savedSize = getCookie("cardSize");
			savedSize !== "" && ((cardSizeSlider.value = savedSize), updateCardSizes());
			document.addEventListener("DOMContentLoaded", () => {
				const page1Link = document.getElementById("page1-link"),
					page2Link = document.getElementById("page2-link");
				if (!page1Link || !page2Link) return;
				const hostname = window.location.hostname,
					linkMap = {
						"shakesgames.github.io": {
							page1: "/#",
							page2: "/shakesgames2/index.html",
						},
					};
				for (const key in linkMap)
					if (hostname.includes(key)) {
						(page1Link.href = linkMap[key].page1),
							(page2Link.href = linkMap[key].page2);
						break;
					}
			});
			(function () {
				var defaultTitle = "ShakesGames",
					defaultFavicon = "img/favicon.ico",
					titleInput = document.getElementById("customTitleInput"),
					faviconInput = document.getElementById("customFaviconInput"),
					resetTitleBtn = document.getElementById("resetTitleBtn"),
					resetFaviconBtn = document.getElementById("resetFaviconBtn"),
					faviconEl = document.querySelector('link[rel="icon"]');
				localStorage.getItem("customTitle")
					? ((document.title = localStorage.getItem("customTitle")),
					  (titleInput.value = localStorage.getItem("customTitle")))
					: (titleInput.value = defaultTitle),
					localStorage.getItem("customFavicon")
						? ((faviconEl.href = localStorage.getItem("customFavicon")),
						  (faviconInput.value = localStorage.getItem("customFavicon")))
						: (faviconInput.value = defaultFavicon),
					titleInput.addEventListener("change", function () {
						var e = titleInput.value.trim();
						e === "" && ((e = defaultTitle), (titleInput.value = defaultTitle)),
							localStorage.setItem("customTitle", e),
							(document.title = e);
					}),
					faviconInput.addEventListener("change", function () {
						var e = faviconInput.value.trim();
						e === "" && ((e = defaultFavicon), (faviconInput.value = defaultFavicon)),
							localStorage.setItem("customFavicon", e),
							(faviconEl.href = e);
					}),
					resetTitleBtn.addEventListener("click", function () {
						localStorage.removeItem("customTitle"),
							(document.title = defaultTitle),
							(titleInput.value = defaultTitle);
					}),
					resetFaviconBtn.addEventListener("click", function () {
						localStorage.removeItem("customFavicon"),
							(faviconEl.href = defaultFavicon),
							(faviconInput.value = defaultFavicon);
					});
			})();
		</script>

		<div
			id="panicBtn"
			title="Panic! (Ctrl+Shift+X)"

			>PANIC</div
		>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const panicBtn = document.getElementById("panicBtn");
				if (localStorage.getItem("sg_panic") !== "off") panicBtn.style.display = "flex";

					window.location.href = "https://www.google.com";

				panicBtn.addEventListener("click", panic);

						e.preventDefault();

			});
		</script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				document.querySelectorAll("#cloakPresets button").forEach(btn => {
					btn.addEventListener("click", () => {
						const [title, favicon] = btn.dataset.cloak.split("|");
						localStorage.setItem("customTitle", title);
						localStorage.setItem("customFavicon", favicon);
						document.title = title;
						const el = document.querySelector('link[rel="icon"]');
						if (el) el.href = favicon;
						const tInput = document.getElementById("customTitleInput");
						const fInput = document.getElementById("customFaviconInput");
						if (tInput) tInput.value = title;
						if (fInput) fInput.value = favicon;
					});
				});
			});
		</script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const gif = document.querySelector(".hero-gif");
				if (gif) {
					gif.addEventListener("click", () => {
						const rect = gif.getBoundingClientRect();
						const cx = rect.left + rect.width / 2;
						const cy = rect.top + rect.height / 2;
						const vw = window.innerWidth;
						const vh = window.innerHeight;

						// golden flash burst
						const flash = document.createElement("div");
						flash.className = "flash";
						flash.style.left = cx + "px";
						flash.style.top = cy + "px";
						document.body.appendChild(flash);
						setTimeout(() => flash.remove(), 600);

						// screen shake
						document.body.classList.add("shake");
						setTimeout(
							() => document.body.classList.remove("shake"),
							500
						);

						const pears = [];
						const rnd = (a, b) => a + Math.random() * (b - a);

						// main shockwave burst
						const burst = Math.floor(rnd(60, 90));
						for (let i = 0; i < burst; i++) {
							const a = Math.random() * Math.PI * 2;
							const sp = rnd(500, 1300);
							pears.push({
								x: cx, y: cy,
								vx: Math.cos(a) * sp,
								vy: Math.sin(a) * sp,
								g: rnd(700, 1100),
								rot: rnd(-360, 360),
								vr: rnd(-14, 14),
								size: rnd(16, 44),
								life: 0, dur: rnd(1.4, 2.6),
								delay: 0,
							});
						}

						// upward fountain
						const fountain = Math.floor(rnd(35, 55));
						for (let i = 0; i < fountain; i++) {
							const a = rnd(Math.PI * 0.12, Math.PI * 0.88);
							const sp = rnd(650, 1200);
							pears.push({
								x: cx + rnd(-14, 14), y: cy,
								vx: Math.cos(a) * sp,
								vy: -Math.abs(Math.sin(a) * sp),
								g: rnd(1100, 1600),
								rot: rnd(-720, 720),
								vr: rnd(-18, 18),
								size: rnd(22, 52),
								life: 0, dur: rnd(1.8, 3.2),
								delay: 0,
							});
						}

						// scattered stragglers that pop late
						const stragglers = Math.floor(rnd(25, 40));
						for (let i = 0; i < stragglers; i++) {
							const a = Math.random() * Math.PI * 2;
							const sp = rnd(150, 600);
							pears.push({
								x: cx, y: cy,
								vx: Math.cos(a) * sp,
								vy: Math.sin(a) * sp - rnd(0, 200),
								g: rnd(700, 1200),
								rot: rnd(-540, 540),
								vr: rnd(-20, 20),
								size: rnd(12, 30),
								life: 0, dur: rnd(1.0, 2.2),
								delay: rnd(150, 950),
							});
						}

						const els = [];
						pears.forEach((p) => {
							const el = document.createElement("span");
							el.className = "pear";
							el.textContent = "🍐";
							el.style.fontSize = p.size + "px";
							el.style.left = p.x + "px";
							el.style.top = p.y + "px";
							el.style.opacity = "0";
							document.body.appendChild(el);
							els.push({ p, el });
						});

						const startT = performance.now();
						(function tick(now) {
							const dt = Math.min((now - startT) / 1000, 0.05);
							let alive = false;
							els.forEach(({ p, el }) => {
								p.life += dt;
								if (p.life < p.delay) {
									el.style.opacity = "0";
									return;
								}
								const t = p.life - p.delay;
								const age = t / p.dur;
								if (age > 1) {
									el.remove();
									return;
								}
								alive = true;
								p.vy += p.g * dt;
								p.x += p.vx * dt;
								p.y += p.vy * dt;
								p.rot += p.vr * dt * 60;
								const alpha = age < 0.7 ? 1 : 1 - (age - 0.7) / 0.3;
								el.style.transform =
									"translate(-50%, -50%) rotate(" + p.rot + "deg) scale(" +
									(0.6 + Math.min(age * 1.4, 0.6)) + ")";
								el.style.opacity = Math.max(alpha, 0);
								el.style.left = p.x + "px";
								el.style.top = p.y + "px";
							});
							if (alive) requestAnimationFrame(tick);
							else setTimeout(() => els.forEach(({ el }) => el.remove()), 100);
						})(startT);
					});
				}
			});
		</script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const box = document.querySelector(".updates-paragraph-text");
				if (!box) return;

				function hslToRgb(h, s, l) {
					s /= 100;
					l /= 100;
					const a = s * Math.min(l, 1 - l);
					const f = n => {
						const k = (n + h / 30) % 12;
						return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
					};
					return [f(0) * 255, f(8) * 255, f(4) * 255];
				}
				function relativeLuminance([r, g, b]) {
					const c = v => {
						const x = v / 255;
						return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
					};
					return 0.2126 * c(r) + 0.7152 * c(g) + 0.0722 * c(b);
				}

				box.addEventListener("click", () => {
					const h = Math.floor(Math.random() * 360);
					const s = Math.floor(60 + Math.random() * 35); // 60-95% saturation
					const anchor = 18 + Math.random() * 64; // 18-82% lightness
					const l1 = Math.min(92, Math.max(10, anchor + (Math.random() * 24 - 12)));
					const l2 = Math.min(92, Math.max(10, anchor + (Math.random() * 24 - 12)));
					const l3 = Math.min(92, Math.max(10, anchor + (Math.random() * 24 - 12)));
					const l4 = Math.min(92, Math.max(10, anchor + (Math.random() * 24 - 12)));
					const hue2 = (h + 40) % 360;
					const hue3 = (h + 320) % 360;

					box.style.background =
						`linear-gradient(156deg, hsl(${h}, ${s}%, ${l1}%), hsl(${hue2}, ${s}%, ${l2}%), hsl(${hue3}, ${s}%, ${l3}%), hsl(${h}, ${s}%, ${l4}%))`;

					// pick a legible text color based on the gradient's average luminance
					const stops = [
						[h, s, l1],
						[hue2, s, l2],
						[hue3, s, l3],
						[h, s, l4],
					];
					const lum =
						stops.reduce(
							(sum, [hh, ss, ll]) => sum + relativeLuminance(hslToRgb(hh, ss, ll)),
							0
						) / stops.length;
					const useDarkText = lum > 0.267;
					box.style.color = useDarkText ? "#1e4d2b" : "#fdf6e3";
					box.style.textShadow = useDarkText ? "none" : "0 1px 3px rgba(0, 0, 0, 0.55)";
				});
			});
		</script>
